<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Precision Flash Memory Assembly and Quality Testing Facility">
  <defs>
    <linearGradient id="facilityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131D"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="goldLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#facilityBg)"/>

  <!-- Matrix Circuit Grid Background -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Cleanroom SMT PCB Board in center with Dark Obsidian & Emerald Accents -->
  <rect x="220" y="80" width="360" height="240" rx="10" fill="#061814" stroke="#059669" stroke-width="2"/>
  
  <!-- PCB Circuit Copper Traces -->
  <g stroke="#10B981" stroke-width="2" fill="none" opacity="0.75">
    <path d="M240 120 L300 120 L330 150 L330 200"/>
    <path d="M260 260 L320 260 L360 220 L440 220"/>
    <path d="M540 130 L480 130 L450 160"/>
    <path d="M520 270 L460 270 L420 230"/>
    <circle cx="240" cy="120" r="3" fill="#34D399"/>
    <circle cx="540" cy="130" r="3" fill="#34D399"/>
    <circle cx="260" cy="260" r="3" fill="#34D399"/>
    <circle cx="520" cy="270" r="3" fill="#34D399"/>
  </g>

  <!-- Central Flash Memory Controller IC -->
  <rect x="340" y="140" width="120" height="120" rx="6" fill="url(#chipGrad)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="362" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FBBF24" letter-spacing="1">FLASH IC</text>
  <text x="356" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#94A3B8">SMI CONTROLLER</text>

  <!-- Chip Pins -->
  <g fill="#94A3B8">
    <rect x="355" y="132" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="375" y="132" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="395" y="132" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="415" y="132" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="435" y="132" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="355" y="260" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="375" y="260" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="395" y="260" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="415" y="260" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="435" y="260" width="6" height="8" rx="1" fill="#F59E0B"/>
    <rect x="332" y="155" width="8" height="6" rx="1"/>
    <rect x="332" y="175" width="8" height="6" rx="1"/>
    <rect x="332" y="195" width="8" height="6" rx="1"/>
    <rect x="332" y="215" width="8" height="6" rx="1"/>
    <rect x="332" y="235" width="8" height="6" rx="1"/>
    <rect x="460" y="155" width="8" height="6" rx="1"/>
    <rect x="460" y="175" width="8" height="6" rx="1"/>
    <rect x="460" y="195" width="8" height="6" rx="1"/>
    <rect x="460" y="215" width="8" height="6" rx="1"/>
    <rect x="460" y="235" width="8" height="6" rx="1"/>
  </g>

  <!-- Left Side: Quality Inspection Scope -->
  <g transform="translate(60, 100)">
    <rect width="130" height="200" rx="8" fill="#131824" stroke="#334155" stroke-width="1.2"/>
    <circle cx="65" cy="65" r="40" fill="#07090E" stroke="#10B981" stroke-width="2"/>
    <path d="M50 65 L60 75 L80 55" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <text x="65" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" text-anchor="middle">H2testw Verified</text>
    <text x="65" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">100% Full Capacity</text>
    <text x="65" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">Burn-In Tested</text>
    <rect x="25" y="175" width="80" height="14" rx="7" fill="#065F46"/>
    <text x="65" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#34D399" text-anchor="middle">PASSED QA</text>
  </g>

  <!-- Right Side: Laser Engraving Customization Station -->
  <g transform="translate(610, 100)">
    <rect width="130" height="200" rx="8" fill="#131824" stroke="#334155" stroke-width="1.2"/>
    <!-- Laser Nozzle -->
    <path d="M50 20 L80 20 L75 50 L55 50 Z" fill="#475569"/>
    <!-- Animated-style Laser beam radiating down -->
    <polygon points="63,50 67,50 78,110 52,110" fill="url(#laserBeam)" filter="url(#goldLaserGlow)"/>
    <line x1="65" y1="50" x2="65" y2="110" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Drive under laser -->
    <rect x="30" y="110" width="70" height="24" rx="3" fill="#334155" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="65" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#FDE68A" text-anchor="middle">CUSTOM LOGO</text>
    <text x="65" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" text-anchor="middle">Laser Engraving</text>
    <text x="65" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">Precision Marking</text>
    <text x="65" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#F59E0B" text-anchor="middle">Spot PMS Pantone</text>
  </g>
  
  <!-- Bottom Caption -->
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">Hardware Assembly • Tier-1 Flash Memory Chips • Rigorous Batch Quality Assurance</text>
</svg>
