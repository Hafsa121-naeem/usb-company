<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" role="img" aria-label="NexDrive Flash Storage Solutions Logo">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7849"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#00D2A0"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132B45"/>
      <stop offset="100%" stop-color="#0B1A2C"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Multi-Color Shield Emblem with USB Core -->
  <g transform="translate(6, 6)">
    <!-- Shield / Plug Base with Emerald & Amber Border -->
    <path d="M4 6 Q14 2 24 2 Q34 2 44 6 L42 34 Q34 46 24 50 Q14 46 6 34 Z" fill="url(#shieldBg)" stroke="url(#emblemGrad)" stroke-width="2.5"/>
    
    <!-- Gold USB Plug Terminal atop shield -->
    <rect x="16" y="0" width="16" height="5" rx="1.5" fill="#F59E0B"/>
    <rect x="19" y="1" width="3" height="3" fill="#0B1A2C"/>
    <rect x="26" y="1" width="3" height="3" fill="#0B1A2C"/>
    
    <!-- Central Glowing Geometric USB Trident -->
    <circle cx="24" cy="18" r="3.2" fill="#00D2A0" filter="url(#logoGlow)"/>
    <path d="M24 21.5 L24 38" stroke="url(#emblemGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 26 L24 30 L32 26" fill="none" stroke="url(#emblemGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15.5" cy="25" r="2.2" fill="#FF7849"/>
    <rect x="30" y="23" width="4" height="4" rx="1" fill="#F59E0B"/>
    <circle cx="24" cy="40" r="2.2" fill="#00D2A0" filter="url(#logoGlow)"/>
  </g>

  <!-- Bold Modern Wordmark -->
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0F2338" letter-spacing="-0.5">NEX<tspan fill="#FF7849">DRIVE</tspan></text>
  <text x="65" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#00A884" letter-spacing="2.4">FLASH STORAGE SYSTEMS</text>
</svg>
