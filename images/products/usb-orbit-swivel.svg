<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Orbit Swivel Flash Drive Model USB-S300 Animated">
  <defs>
    <linearGradient id="s300Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="swivelArm" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="sDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes swivelSwing {
        0%, 100% { transform: rotate(-16deg); }
        50% { transform: rotate(26deg); }
      }
      @keyframes floatBody {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.25; }
      }

      .anim-swivel-clip {
        transform-origin: 160px 70px;
        animation: swivelSwing 4.5s ease-in-out infinite;
      }
      .anim-body-group { animation: floatBody 5s ease-in-out infinite; }
      .anim-led { animation: ledPulse 1.4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-swivel-clip, .anim-body-group, .anim-led { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="600" height="450" rx="14" fill="url(#s300Bg)" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="300" cy="225" r="160" fill="#F59E0B" opacity="0.04"/>
  <circle cx="300" cy="225" r="120" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" fill="none"/>

  <g transform="translate(100, 160)" class="anim-body-group" filter="url(#sDrop)">
    <!-- USB-A Plug (Left) -->
    <rect x="0" y="42" width="70" height="56" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <rect x="10" y="48" width="50" height="44" rx="2" fill="#F59E0B"/>
    <rect x="18" y="52" width="6" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="28" y="52" width="6" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="38" y="52" width="6" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="48" y="52" width="6" height="16" fill="#FFFFFF" rx="1"/>

    <!-- Matte Black Rubberized Housing Body -->
    <rect x="65" y="32" width="220" height="76" rx="8" fill="#181E29" stroke="#334155" stroke-width="1.2"/>
    
    <!-- LED Activity indicator slot with Amber Animation -->
    <rect x="260" y="65" width="12" height="10" rx="2" fill="#F59E0B" filter="url(#amberGlow)" class="anim-led"/>

    <!-- Swiveling Clip Group (Animated 360° Rotational Demonstration) -->
    <g class="anim-swivel-clip">
      <path d="M120 22 L310 16 Q335 15 340 40 L340 100 Q335 125 310 124 L120 118 Z" fill="url(#swivelArm)" stroke="#94A3B8" stroke-width="1.2"/>
      
      <circle cx="318" cy="70" r="12" fill="#090C12"/>
      <circle cx="318" cy="70" r="15" stroke="#F59E0B" stroke-width="2" fill="none"/>

      <rect x="150" y="45" width="130" height="50" rx="4" fill="#090C12" opacity="0.12"/>
      <text x="160" y="70" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" fill="#090C12" letter-spacing="1">ORBIT SWIVEL</text>
      <text x="160" y="85" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#1E293B">USB-S300 • CAPLESS 360°</text>
    </g>

    <circle cx="160" cy="70" r="11" fill="#334155"/>
    <circle cx="160" cy="70" r="7" fill="#F59E0B"/>
    <circle cx="160" cy="70" r="3" fill="#090C12"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="135" height="28" rx="14" fill="#090C12" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="67" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" text-anchor="middle">SWIVEL / BULK</text>
  </g>
</svg>
