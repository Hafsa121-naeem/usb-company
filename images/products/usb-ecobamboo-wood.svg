<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="EcoBamboo Wooden USB Flash Drive Animated">
  <defs>
    <linearGradient id="e600Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="25%" stop-color="#B45309"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="usbPlugGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="wDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <style>
      @keyframes capSnapAction {
        0%, 100% { transform: translateX(0); }
        35% { transform: translateX(-18px); }
        55% { transform: translateX(-18px); }
        75% { transform: translateX(0); }
      }
      @keyframes floatWood {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .anim-cap { animation: capSnapAction 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-wood-group { animation: floatWood 5.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-cap, .anim-wood-group { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="600" height="450" rx="14" fill="url(#e600Bg)" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="300" cy="225" r="160" fill="#F59E0B" opacity="0.04"/>

  <g transform="translate(100, 160)" class="anim-wood-group" filter="url(#wDrop)">
    <!-- Animated USB Magnetic Cap -->
    <g class="anim-cap">
      <rect x="0" y="24" width="75" height="82" rx="8" fill="url(#woodGrad)" stroke="#78350F" stroke-width="1.5"/>
      <path d="M10 35 Q40 40 70 34 M15 55 Q45 52 65 58 M10 75 Q35 78 68 74 M20 92 Q50 90 70 94" stroke="#451A03" stroke-width="1.2" opacity="0.6" fill="none"/>
      <circle cx="70" cy="65" r="3.5" fill="#FDE68A" stroke="#B45309" stroke-width="0.8"/>
    </g>

    <!-- Exposed USB-A 3.0 Connector -->
    <rect x="85" y="37" width="45" height="56" rx="2" fill="url(#usbPlugGold)"/>
    <rect x="92" y="42" width="34" height="46" rx="2" fill="#F59E0B"/>
    <rect x="98" y="46" width="5" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="108" y="46" width="5" height="16" fill="#FFFFFF" rx="1"/>
    <rect x="118" y="46" width="5" height="16" fill="#FFFFFF" rx="1"/>

    <!-- Main Bamboo Wood Body -->
    <rect x="130" y="24" width="220" height="82" rx="8" fill="url(#woodGrad)" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="135" cy="65" r="3.5" fill="#FDE68A" stroke="#B45309" stroke-width="0.8"/>

    <path d="M140 38 Q240 42 340 36 M150 54 Q250 50 335 56 M140 72 Q230 76 340 70 M145 90 Q260 88 335 92" stroke="#451A03" stroke-width="1.4" opacity="0.6" fill="none"/>

    <!-- Laser Burn Engraved Branding -->
    <text x="170" y="58" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#2E1005" letter-spacing="1">ECOBAMBOO</text>
    <text x="170" y="74" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#3D1807" letter-spacing="0.5">MODEL USB-E600 • USB 3.0</text>
    <text x="170" y="88" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#451A03">FSC® CERTIFIED NATURAL BAMBOO</text>

    <!-- Eco Leaf Stamp in Emerald -->
    <path d="M315 50 Q325 45 330 55 Q325 65 315 65 Q310 58 315 50 Z" fill="#10B981" opacity="0.95"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(30, 30)">
    <rect width="170" height="28" rx="14" fill="#090C12" stroke="#10B981" stroke-width="1.2"/>
    <text x="85" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="middle">SUSTAINABLE BAMBOO</text>
  </g>
</svg>
