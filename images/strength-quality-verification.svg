<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D2D"/>
      <stop offset="100%" stop-color="#132B40"/>
    </linearGradient>

    <linearGradient id="sqRadarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D2A0" stop-opacity="0"/>
    </linearGradient>

    <filter id="sqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes sqRadarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes sqSectorBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; fill: #00D2A0; }
      }
      @keyframes sqLedPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00D2A0); }
        50% { opacity: 0.35; filter: none; }
      }
      @keyframes sqWaveLine {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }

      .sq-radar-arm {
        transform-origin: 200px 105px;
        animation: sqRadarRotate 4s linear infinite;
      }
      .sq-sector {
        animation: sqSectorBlink 2.4s ease-in-out infinite;
      }
      .sq-led {
        animation: sqLedPulse 1.3s ease-in-out infinite;
      }
      .sq-wave {
        stroke-dasharray: 8, 6;
        animation: sqWaveLine 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="240" rx="14" fill="url(#sqBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="13" fill="none" stroke="#254A6B" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Radar Grid Circles -->
  <g stroke="#183D5C" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <circle cx="200" cy="105" r="25"/>
    <circle cx="200" cy="105" r="50"/>
    <circle cx="200" cy="105" r="75"/>
    <line x1="200" y1="20" x2="200" y2="190"/>
    <line x1="115" y1="105" x2="285" y2="105"/>
  </g>

  <!-- Sector Diagnostic Memory Matrix (NAND Flash Die Blocks) -->
  <g transform="translate(145, 60)" stroke="#1A4062" stroke-width="1">
    <!-- Row 1 -->
    <rect x="0" y="0" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.1s;"/>
    <rect x="28" y="0" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.4s;"/>
    <rect x="56" y="0" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.7s;"/>
    <rect x="84" y="0" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.0s;"/>
    <!-- Row 2 -->
    <rect x="0" y="24" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.2s;"/>
    <rect x="28" y="24" width="22" height="18" rx="3" fill="#00D2A0" opacity="0.85"/>
    <rect x="56" y="24" width="22" height="18" rx="3" fill="#00D2A0" opacity="0.85"/>
    <rect x="84" y="24" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.5s;"/>
    <!-- Row 3 -->
    <rect x="0" y="48" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.7s;"/>
    <rect x="28" y="48" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 2.0s;"/>
    <rect x="56" y="48" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 2.2s;"/>
    <rect x="84" y="48" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.3s;"/>
    <!-- Row 4 -->
    <rect x="0" y="72" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.6s;"/>
    <rect x="28" y="72" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 0.9s;"/>
    <rect x="56" y="72" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.3s;"/>
    <rect x="84" y="72" width="22" height="18" rx="3" fill="#132B40" class="sq-sector" style="animation-delay: 1.8s;"/>
  </g>

  <!-- Rotating Scanner Radar Arm -->
  <g class="sq-radar-arm">
    <path d="M 200,105 L 275,105 A 75 75 0 0 0 253,52 Z" fill="url(#sqRadarGrad)"/>
    <line x1="200" y1="105" x2="275" y2="105" stroke="#00D2A0" stroke-width="2" filter="url(#sqGlow)"/>
  </g>

  <!-- Bottom Telemetry Readout Bar -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="340" height="34" rx="6" fill="#081825" stroke="#1B3E5C" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#00D2A0" class="sq-led"/>
    <text x="32" y="14" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700">H2TESTW SECTOR INTEGRITY</text>
    <text x="32" y="25" fill="#00D2A0" font-family="monospace" font-size="8.5" font-weight="700">100% VALIDATED • 0 ERRORS DETECTED</text>
    <rect x="260" y="8" width="68" height="18" rx="9" fill="#122F47" stroke="#00D2A0" stroke-width="1"/>
    <text x="294" y="20" fill="#00D2A0" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">PASSED ✓</text>
  </g>
</svg>