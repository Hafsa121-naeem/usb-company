<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D2D"/>
      <stop offset="100%" stop-color="#182A3A"/>
    </linearGradient>

    <linearGradient id="sdDriveMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4D62"/>
      <stop offset="50%" stop-color="#718298"/>
      <stop offset="100%" stop-color="#233548"/>
    </linearGradient>

    <filter id="sdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes sdReticleMove {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(70px, 0); }
      }
      @keyframes sdAnchorPulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes sdLaserGleam {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.95; }
      }
      @keyframes sdDotPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #F59E0B); }
        50% { opacity: 0.3; filter: none; }
      }

      .sd-crosshair {
        animation: sdReticleMove 3.6s ease-in-out infinite;
      }
      .sd-anchor {
        transform-origin: center;
        animation: sdAnchorPulse 1.8s ease-in-out infinite;
      }
      .sd-laser-line {
        animation: sdLaserGleam 1.5s ease-in-out infinite;
      }
      .sd-amber-dot {
        animation: sdDotPulse 1.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="14" fill="url(#sdBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="13" fill="none" stroke="#254A6B" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- CAD Blueprint Grid -->
  <g stroke="#1A3B58" stroke-width="0.8" stroke-opacity="0.4">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="270" y1="0" x2="270" y2="240"/>
    <line x1="340" y1="0" x2="340" y2="240"/>
  </g>

  <!-- Dimension Guides & Measurement Rulers -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.6">
    <!-- Top Dimension Line -->
    <line x1="110" y1="48" x2="290" y2="48"/>
    <line x1="110" y1="44" x2="110" y2="52"/>
    <line x1="290" y1="44" x2="290" y2="52"/>
    <text x="200" y="44" fill="#F59E0B" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">54.00 mm</text>
  </g>

  <!-- USB Flash Drive 3D Metal Model -->
  <g transform="translate(110, 70)">
    <!-- USB Plug Tip -->
    <rect x="0" y="15" width="30" height="30" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
    <rect x="8" y="21" width="10" height="6" rx="1" fill="#0B1D2D"/>
    <rect x="8" y="33" width="10" height="6" rx="1" fill="#0B1D2D"/>

    <!-- Titanium Metal Body -->
    <rect x="30" y="0" width="150" height="60" rx="6" fill="url(#sdDriveMetal)" stroke="#536982" stroke-width="1.5"/>

    <!-- Vector Mockup Artwork Outline Area -->
    <rect x="65" y="12" width="95" height="36" rx="4" fill="#0C1D2D" stroke="#00D2A0" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Corporate Logo Vector Inscription -->
    <g transform="translate(75, 18)">
      <polygon points="10,2 20,20 0,20" fill="none" stroke="#FF6B4A" stroke-width="1.8"/>
      <circle cx="10" cy="12" r="2.5" fill="#FF6B4A"/>
      <text x="30" y="14" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="900" letter-spacing="1">LOGO MOCKUP</text>
      <text x="30" y="22" fill="#94A3B8" font-family="monospace" font-size="6.5">VECTOR LASER PROOF</text>
    </g>

    <!-- Vector Anchor Nodes (CAD Handles) -->
    <rect x="63" y="10" width="4" height="4" fill="#00D2A0" class="sd-anchor"/>
    <rect x="158" y="10" width="4" height="4" fill="#00D2A0" class="sd-anchor"/>
    <rect x="63" y="46" width="4" height="4" fill="#00D2A0" class="sd-anchor"/>
    <rect x="158" y="46" width="4" height="4" fill="#00D2A0" class="sd-anchor"/>
  </g>

  <!-- Animated Optical Reticle / Crosshair Scanner -->
  <g transform="translate(130, 85)" class="sd-crosshair">
    <circle cx="20" cy="15" r="14" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="20" y1="-2" x2="20" y2="32" stroke="#F59E0B" stroke-width="1.2"/>
    <line x1="3" y1="15" x2="37" y2="15" stroke="#F59E0B" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="3" fill="#F59E0B" filter="url(#sdGlow)"/>
  </g>

  <!-- Bottom Telemetry Readout Bar -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="340" height="34" rx="6" fill="#081825" stroke="#1B3E5C" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#F59E0B" class="sd-amber-dot"/>
    <text x="32" y="14" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700">COMPLIMENTARY VECTOR PROOFING</text>
    <text x="32" y="25" fill="#F59E0B" font-family="monospace" font-size="8.5" font-weight="700">24-HOUR DIGITAL RENDER • 1:1 SCALE ACCURACY</text>
    <rect x="260" y="8" width="68" height="18" rx="9" fill="#1B2836" stroke="#F59E0B" stroke-width="1"/>
    <text x="294" y="20" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">ACTIVE ⚡</text>
  </g>
</svg>