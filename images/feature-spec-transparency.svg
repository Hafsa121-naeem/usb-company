<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D2D"/>
      <stop offset="100%" stop-color="#142B3E"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A54"/>
      <stop offset="100%" stop-color="#0D2030"/>
    </linearGradient>

    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2A0" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00D2A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D2A0" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes traceFlow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(140px); opacity: 0; }
      }
      @keyframes ledBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00D2A0); }
        50% { opacity: 0.3; filter: none; }
      }
      @keyframes meterSweep {
        0%, 100% { width: 85px; }
        50% { width: 145px; }
      }

      .animated-trace {
        stroke-dasharray: 12, 10;
        animation: traceFlow 2s linear infinite;
      }
      .animated-beam {
        animation: scanBeam 3.5s ease-in-out infinite;
      }
      .animated-led {
        animation: ledBlink 1.4s ease-in-out infinite;
      }
      .animated-meter {
        animation: meterSweep 4s ease-in-out infinite;
      }
      .halo-pulse {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="400" height="260" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="398" height="258" rx="15" fill="none" stroke="#254A6B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Circuit Grid Overlay -->
  <g stroke="#1A3B58" stroke-width="0.8" stroke-opacity="0.4">
    <line x1="30" y1="0" x2="30" y2="260"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="130" y1="0" x2="130" y2="260"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="230" y1="0" x2="230" y2="260"/>
    <line x1="280" y1="0" x2="280" y2="260"/>
    <line x1="330" y1="0" x2="330" y2="260"/>
    <line x1="370" y1="0" x2="370" y2="260"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="190" x2="400" y2="190"/>
    <line x1="0" y1="230" x2="400" y2="230"/>
  </g>

  <!-- Ambient Glow Behind Chip -->
  <circle cx="200" cy="120" r="75" fill="#00D2A0" opacity="0.15" filter="url(#neonGlow)" class="halo-pulse"/>

  <!-- Copper & Data Circuit Traces Leading to Chip -->
  <!-- Left Inflow Traces -->
  <path d="M 30,70 L 90,70 L 120,95 L 140,95" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 30,70 L 90,70 L 120,95 L 140,95" fill="none" stroke="#00D2A0" stroke-width="2.5" class="animated-trace"/>

  <path d="M 30,120 L 140,120" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 30,120 L 140,120" fill="none" stroke="#00D2A0" stroke-width="2.5" class="animated-trace"/>

  <path d="M 30,170 L 90,170 L 120,145 L 140,145" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 30,170 L 90,170 L 120,145 L 140,145" fill="none" stroke="#00D2A0" stroke-width="2.5" class="animated-trace"/>

  <!-- Right Outflow Traces -->
  <path d="M 260,95 L 280,95 L 310,70 L 370,70" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 260,95 L 280,95 L 310,70 L 370,70" fill="none" stroke="#FF6B4A" stroke-width="2.5" class="animated-trace"/>

  <path d="M 260,120 L 370,120" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 260,120 L 370,120" fill="none" stroke="#FF6B4A" stroke-width="2.5" class="animated-trace"/>

  <path d="M 260,145 L 280,145 L 310,170 L 370,170" fill="none" stroke="#2B5A7A" stroke-width="2"/>
  <path d="M 260,145 L 280,145 L 310,170 L 370,170" fill="none" stroke="#FF6B4A" stroke-width="2.5" class="animated-trace"/>

  <!-- Central Silicon Controller Die (Microchip) -->
  <g transform="translate(140, 50)">
    <!-- Chip Outer Shell -->
    <rect x="0" y="0" width="120" height="140" rx="8" fill="url(#chipGrad)" stroke="#396B94" stroke-width="2"/>
    
    <!-- Chip Pins / Contacts -->
    <!-- Left pins -->
    <rect x="-6" y="20" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="35" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="50" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="65" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="80" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="95" width="6" height="5" fill="#E2B04E"/>
    <rect x="-6" y="110" width="6" height="5" fill="#E2B04E"/>
    <!-- Right pins -->
    <rect x="120" y="20" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="35" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="50" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="65" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="80" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="95" width="6" height="5" fill="#E2B04E"/>
    <rect x="120" y="110" width="6" height="5" fill="#E2B04E"/>

    <!-- Transparent Silicon Glass Window -->
    <rect x="12" y="14" width="96" height="112" rx="4" fill="#0A1624" fill-opacity="0.85" stroke="#00D2A0" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Micro Architecture Markings -->
    <text x="60" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">TIER-1 NAND IC</text>
    <text x="60" y="44" fill="#00D2A0" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">SMI-2259XT</text>

    <!-- Inner Core Logic Grid -->
    <rect x="24" y="52" width="72" height="42" rx="2" fill="#132B40" stroke="#205072" stroke-width="1"/>
    
    <!-- Micro Logic Blocks inside Core -->
    <rect x="28" y="56" width="14" height="15" fill="#00D2A0" opacity="0.3"/>
    <rect x="46" y="56" width="14" height="15" fill="#FF6B4A" opacity="0.3"/>
    <rect x="64" y="56" width="14" height="15" fill="#F59E0B" opacity="0.3"/>
    <rect x="82" y="56" width="10" height="15" fill="#00D2A0" opacity="0.3"/>

    <rect x="28" y="75" width="32" height="14" fill="#2457E6" opacity="0.3"/>
    <rect x="64" y="75" width="28" height="14" fill="#00D2A0" opacity="0.4"/>

    <!-- Scanning Laser Light Beam across Silicon -->
    <line x1="14" y1="14" x2="106" y2="14" stroke="#00D2A0" stroke-width="2.5" filter="url(#neonGlow)" class="animated-beam"/>

    <!-- Verified Status at Bottom of Chip -->
    <circle cx="28" cy="110" r="3.5" fill="#00D2A0" class="animated-led"/>
    <text x="38" y="113" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700">100% VERIFIED</text>
  </g>

  <!-- Bottom Real-Time Diagnostic HUD Bar -->
  <g transform="translate(30, 205)">
    <!-- HUD Panel Card -->
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#0D2235" stroke="#1E4364" stroke-width="1"/>
    
    <!-- Label -->
    <text x="14" y="17" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5">CONTINUOUS READ BENCHMARK</text>
    <text x="14" y="30" fill="#00D2A0" font-family="monospace" font-size="9" font-weight="700">148.8 MB/s (USB 3.2 GEN 1)</text>

    <!-- Animated Data Progress Bar -->
    <rect x="180" y="15" width="145" height="10" rx="5" fill="#132B40"/>
    <rect x="180" y="15" width="90" height="10" rx="5" fill="url(#traceGrad)" class="animated-meter"/>

    <!-- Status Tick -->
    <circle cx="315" cy="20" r="3" fill="#00D2A0" class="animated-led"/>
  </g>
</svg>