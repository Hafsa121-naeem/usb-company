<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bulkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2135"/>
      <stop offset="100%" stop-color="#152F48"/>
    </linearGradient>

    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4466"/>
      <stop offset="100%" stop-color="#122C44"/>
    </linearGradient>

    <linearGradient id="conveyorBelt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B3852"/>
      <stop offset="50%" stop-color="#244B6E"/>
      <stop offset="100%" stop-color="#1B3852"/>
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes conveyorMotion {
        0% { transform: translateX(0); }
        100% { transform: translateX(40px); }
      }
      @keyframes boxGlide {
        0% { transform: translateX(-40px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(20px); opacity: 0; }
      }
      @keyframes scannerScan {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(35px); opacity: 0.9; }
      }
      @keyframes pulseBadge {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes statusDot {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #F59E0B); }
        50% { opacity: 0.4; filter: none; }
      }

      .conveyor-teeth {
        animation: conveyorMotion 1.5s linear infinite;
      }
      .scanner-beam {
        animation: scannerScan 2.5s ease-in-out infinite;
      }
      .live-dot {
        animation: statusDot 1.6s ease-in-out infinite;
      }
      .interactive-badge {
        transform-origin: center;
        animation: pulseBadge 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background with Border -->
  <rect width="400" height="260" rx="16" fill="url(#bulkBg)"/>
  <rect x="1" y="1" width="398" height="258" rx="15" fill="none" stroke="#254A6B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Warehouse / Logistics Tech Grid Lines -->
  <g stroke="#1A3B58" stroke-width="0.8" stroke-opacity="0.35">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="260"/>
    <line x1="160" y1="0" x2="160" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="320" y1="0" x2="320" y2="260"/>
  </g>

  <!-- Ambient Amber Glow on Packaging Station -->
  <circle cx="200" cy="110" r="80" fill="#F59E0B" opacity="0.12" filter="url(#amberGlow)"/>

  <!-- Logistics Pallet & Conveyor Platform -->
  <g id="conveyor-group" transform="translate(30, 150)">
    <!-- Main Conveyor Bed -->
    <rect x="0" y="0" width="340" height="22" rx="4" fill="url(#conveyorBelt)" stroke="#2C577D" stroke-width="1.5"/>
    
    <!-- Moving Teeth Pattern (Masked inside Conveyor) -->
    <g class="conveyor-teeth" opacity="0.45" stroke="#386E9E" stroke-width="2">
      <line x1="-30" y1="3" x2="-30" y2="19"/>
      <line x1="-10" y1="3" x2="-10" y2="19"/>
      <line x1="10" y1="3" x2="10" y2="19"/>
      <line x1="30" y1="3" x2="30" y2="19"/>
      <line x1="50" y1="3" x2="50" y2="19"/>
      <line x1="70" y1="3" x2="70" y2="19"/>
      <line x1="90" y1="3" x2="90" y2="19"/>
      <line x1="110" y1="3" x2="110" y2="19"/>
      <line x1="130" y1="3" x2="130" y2="19"/>
      <line x1="150" y1="3" x2="150" y2="19"/>
      <line x1="170" y1="3" x2="170" y2="19"/>
      <line x1="190" y1="3" x2="190" y2="19"/>
      <line x1="210" y1="3" x2="210" y2="19"/>
      <line x1="230" y1="3" x2="230" y2="19"/>
      <line x1="250" y1="3" x2="250" y2="19"/>
      <line x1="270" y1="3" x2="270" y2="19"/>
      <line x1="290" y1="3" x2="290" y2="19"/>
      <line x1="310" y1="3" x2="310" y2="19"/>
      <line x1="330" y1="3" x2="330" y2="19"/>
      <line x1="350" y1="3" x2="350" y2="19"/>
      <line x1="370" y1="3" x2="370" y2="19"/>
    </g>

    <!-- Support Pillars Below Conveyor -->
    <rect x="35" y="22" width="12" height="24" fill="#132B40" stroke="#22486A" stroke-width="1"/>
    <rect x="164" y="22" width="12" height="24" fill="#132B40" stroke="#22486A" stroke-width="1"/>
    <rect x="293" y="22" width="12" height="24" fill="#132B40" stroke="#22486A" stroke-width="1"/>
  </g>

  <!-- Corporate Packaging Cargo & Master Cartons on Conveyor -->
  <!-- Box 1 (Left: Standard Bulk Packaging) -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="70" height="65" rx="5" fill="url(#boxGrad2)" stroke="#2B5A82" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="70" y2="20" stroke="#204565" stroke-width="1.2"/>
    <rect x="15" y="8" width="40" height="4" rx="2" fill="#F59E0B" opacity="0.7"/>
    <rect x="18" y="32" width="34" height="20" rx="3" fill="#0E2336" stroke="#224B70" stroke-width="1"/>
    <text x="35" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="700" text-anchor="middle">500 PCS</text>
    <text x="35" y="50" fill="#00D2A0" font-family="monospace" font-size="5" text-anchor="middle">USB-M100</text>
  </g>

  <!-- Box 2 (Center Master Carton with Optical Scanner) -->
  <g transform="translate(155, 60)">
    <!-- Main Master Carton -->
    <rect x="0" y="0" width="90" height="90" rx="6" fill="#173854" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Heavy-Duty Sealing Tape in Amber -->
    <rect x="38" y="0" width="14" height="90" fill="#F59E0B" opacity="0.85"/>
    <line x1="45" y1="0" x2="45" y2="90" stroke="#92400E" stroke-dasharray="2,2" stroke-width="1"/>

    <!-- Corporate Shipping Manifest Label -->
    <rect x="10" y="25" width="22" height="30" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <line x1="13" y1="30" x2="27" y2="30" stroke="#0B1D2D" stroke-width="1.5"/>
    <line x1="13" y1="34" x2="29" y2="34" stroke="#0B1D2D" stroke-width="1"/>
    <line x1="13" y1="38" x2="25" y2="38" stroke="#0B1D2D" stroke-width="1"/>
    <!-- Simulated 2D Barcode -->
    <rect x="13" y="43" width="9" height="9" fill="#0B1D2D"/>

    <!-- Front Logo Mark on Box -->
    <circle cx="70" cy="40" r="12" fill="#0C2032" stroke="#2A5C87" stroke-width="1.2"/>
    <path d="M 66,35 L 70,39 L 74,35 M 70,39 L 70,46" fill="none" stroke="#F59E0B" stroke-width="1.8"/>

    <!-- Quality Control Verified Stamp -->
    <rect x="54" y="62" width="30" height="16" rx="3" fill="#00D2A0" fill-opacity="0.15" stroke="#00D2A0" stroke-width="1.2"/>
    <text x="69" y="73" fill="#00D2A0" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">PASSED</text>
  </g>

  <!-- Box 3 (Right: Dispatched Tray Stack) -->
  <g transform="translate(265, 80)">
    <rect x="0" y="0" width="75" height="70" rx="5" fill="url(#boxGrad2)" stroke="#2B5A82" stroke-width="1.5"/>
    <line x1="0" y1="22" x2="75" y2="22" stroke="#204565" stroke-width="1.2"/>
    <rect x="20" y="9" width="35" height="4" rx="2" fill="#FF6B4A" opacity="0.8"/>
    <!-- Stack Lines -->
    <line x1="12" y1="36" x2="63" y2="36" stroke="#234E74" stroke-width="1.5"/>
    <line x1="12" y1="48" x2="63" y2="48" stroke="#234E74" stroke-width="1.5"/>
    <text x="37" y="60" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="700" text-anchor="middle">DISPATCH TRAY</text>
  </g>

  <!-- Automated Overhead QA Scanner Head over Center Box -->
  <g transform="translate(180, 25)">
    <!-- Scanner Mounting Bracket -->
    <rect x="10" y="0" width="20" height="14" rx="2" fill="#0D2030" stroke="#3A6A92" stroke-width="1.2"/>
    <circle cx="20" cy="14" r="5" fill="#F59E0B"/>
    
    <!-- Scanning Laser Cone / Beam -->
    <polygon points="12,18 28,18 55,60 -15,60" fill="#F59E0B" opacity="0.15" class="scanner-beam"/>
    <line x1="20" y1="18" x2="20" y2="60" stroke="#F59E0B" stroke-width="2" filter="url(#amberGlow)" class="scanner-beam"/>
  </g>

  <!-- Bottom Logistics Telemetry Panel -->
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="340" height="40" rx="8" fill="#0B1A28" stroke="#1D4060" stroke-width="1"/>
    
    <!-- Status Dot -->
    <circle cx="20" cy="20" r="4" fill="#F59E0B" class="live-dot"/>
    <text x="32" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">PROCUREMENT SUPPLY LOGISTICS</text>
    <text x="32" y="29" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="700">100 to 50,000+ Units • 24h Proofs</text>

    <!-- Global Compliance Pill Badge -->
    <g transform="translate(240, 9)" class="interactive-badge">
      <rect x="0" y="0" width="85" height="22" rx="11" fill="#132B40" stroke="#00D2A0" stroke-width="1"/>
      <text x="42" y="14" fill="#00D2A0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">TIER-1 SUPPLY</text>
    </g>
  </g>
</svg>