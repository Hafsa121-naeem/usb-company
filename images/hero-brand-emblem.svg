<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="NexDrive Official Corporate Brand Crest">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C7C64"/>
      <stop offset="50%" stop-color="#738670"/>
      <stop offset="100%" stop-color="#467A58"/>
    </linearGradient>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#F4F0E8"/>
    </linearGradient>
    <linearGradient id="sageTrident" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#738670"/>
      <stop offset="50%" stop-color="#5C7C64"/>
      <stop offset="100%" stop-color="#3D5343"/>
    </linearGradient>
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1C231E" flood-opacity="0.08"/>
    </filter>

    <style>
      @keyframes crestFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .anim-crest { animation: crestFloat 6s ease-in-out infinite; transform-origin: 180px 180px; }
      .anim-orbit { animation: orbitRing 24s linear infinite; transform-origin: 180px 180px; }
      @media (prefers-reduced-motion: reduce) {
        .anim-crest, .anim-orbit { animation: none !important; }
      }
    </style>
  </defs>

  <g class="anim-crest" filter="url(#emblemShadow)">
    <!-- Outer Ambient Circle -->
    <circle cx="180" cy="180" r="160" fill="url(#ringGrad)" opacity="0.06"/>

    <!-- Rotating Outer Orbit Ring with Node Marks -->
    <g class="anim-orbit">
      <circle cx="180" cy="180" r="150" stroke="url(#ringGrad)" stroke-width="2" fill="none" stroke-dasharray="14 10 32 10"/>
      <circle cx="180" cy="30" r="5" fill="#5C7C64"/>
      <circle cx="330" cy="180" r="5" fill="#738670"/>
      <circle cx="180" cy="330" r="5" fill="#467A58"/>
      <circle cx="30" cy="180" r="5" fill="#5C7C64"/>
    </g>

    <!-- Concentric Inner Ring -->
    <circle cx="180" cy="180" r="132" stroke="rgba(92, 124, 100, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- Central Core Shield / Medallion in Soft Beige / Off-White -->
    <circle cx="180" cy="180" r="120" fill="url(#coreBg)" stroke="url(#ringGrad)" stroke-width="2.5"/>

    <!-- USB Plug Cap on Top of Medallion -->
    <rect x="150" y="70" width="60" height="28" rx="6" fill="#F4F0E8" stroke="#5C7C64" stroke-width="2"/>
    <rect x="160" y="76" width="10" height="12" rx="1.5" fill="#5C7C64"/>
    <rect x="190" y="76" width="10" height="12" rx="1.5" fill="#5C7C64"/>

    <!-- Central Geometric Trident Emblem in Sage Green -->
    <circle cx="180" cy="130" r="9" fill="#5C7C64"/>
    <circle cx="180" cy="130" r="4.5" fill="#FFFFFF"/>
    
    <!-- Central Stem -->
    <path d="M180 144 L180 236" stroke="url(#sageTrident)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Left Wing -->
    <path d="M142 165 L180 190" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M142 165 L142 152" stroke="#5C7C64" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="142" cy="148" r="7" fill="#5C7C64"/>
    <circle cx="142" cy="148" r="3.5" fill="#FFFFFF"/>

    <!-- Right Wing -->
    <path d="M218 165 L180 190" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M218 165 L218 152" stroke="#738670" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="211" y="141" width="14" height="14" rx="2.5" fill="#738670" transform="rotate(45 218 148)"/>

    <!-- Bottom Node -->
    <circle cx="180" cy="242" r="7" fill="#467A58"/>

    <!-- Brand Typography in Warm Charcoal and Sage -->
    <text x="180" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#1C231E" text-anchor="middle" letter-spacing="3">NEXDRIVE</text>
    <text x="180" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#5C7C64" text-anchor="middle" letter-spacing="2">TIER-1 FLASH VERIFIED</text>
  </g>
</svg>
