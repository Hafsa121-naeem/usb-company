<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="NexDrive Official Corporate Brand Crest">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7849"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#00D2A0"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="coreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132B45"/>
      <stop offset="50%" stop-color="#0D1E31"/>
      <stop offset="100%" stop-color="#081422"/>
    </linearGradient>
    <linearGradient id="goldTrident" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#081422" flood-opacity="0.45"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes crestFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlowRing {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .anim-crest { animation: crestFloat 6s ease-in-out infinite; transform-origin: 180px 180px; }
      .anim-orbit { animation: orbitRing 24s linear infinite; transform-origin: 180px 180px; }
      .anim-glow { animation: pulseGlowRing 4s ease-in-out infinite; transform-origin: 180px 180px; }

      @media (prefers-reduced-motion: reduce) {
        .anim-crest, .anim-orbit, .anim-glow { animation: none !important; }
      }
    </style>
  </defs>

  <g class="anim-crest" filter="url(#emblemShadow)">
    <!-- Outer Ambient Glow Circle -->
    <circle cx="180" cy="180" r="160" fill="url(#ringGrad)" opacity="0.18" class="anim-glow" filter="url(#neonGlow)"/>

    <!-- Rotating Outer Orbit Ring with Data Node Marks -->
    <g class="anim-orbit">
      <circle cx="180" cy="180" r="150" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" stroke-dasharray="14 10 32 10"/>
      <circle cx="180" cy="30" r="6" fill="#FF7849" filter="url(#neonGlow)"/>
      <circle cx="330" cy="180" r="6" fill="#F59E0B" filter="url(#neonGlow)"/>
      <circle cx="180" cy="330" r="6" fill="#00D2A0" filter="url(#neonGlow)"/>
      <circle cx="30" cy="180" r="6" fill="#8B5CF6" filter="url(#neonGlow)"/>
    </g>

    <!-- Concentric Inner Tech Ring -->
    <circle cx="180" cy="180" r="132" stroke="rgba(255, 120, 73, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- Central Core Shield / Medallion -->
    <circle cx="180" cy="180" r="120" fill="url(#coreBg)" stroke="url(#ringGrad)" stroke-width="3.5"/>

    <!-- USB Plug Cap on Top of Medallion -->
    <rect x="150" y="70" width="60" height="28" rx="6" fill="#1A3A5A" stroke="#F59E0B" stroke-width="2"/>
    <rect x="160" y="76" width="10" height="12" rx="1.5" fill="#FFE082"/>
    <rect x="190" y="76" width="10" height="12" rx="1.5" fill="#FFE082"/>

    <!-- Central Majestic Geometric Trident Emblem -->
    <!-- Top Central Node in Emerald -->
    <circle cx="180" cy="130" r="11" fill="#00D2A0" filter="url(#neonGlow)"/>
    <circle cx="180" cy="130" r="6" fill="#FFFFFF"/>
    
    <!-- Central Stem -->
    <path d="M180 144 L180 236" stroke="url(#goldTrident)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Wing (Coral) -->
    <path d="M142 165 L180 190" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M142 165 L142 152" stroke="#FF7849" stroke-width="5" stroke-linecap="round"/>
    <circle cx="142" cy="148" r="8" fill="#FF7849" filter="url(#neonGlow)"/>
    <circle cx="142" cy="148" r="4" fill="#FFFFFF"/>

    <!-- Right Wing (Amber Diamond) -->
    <path d="M218 165 L180 190" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M218 165 L218 152" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <rect x="210" y="140" width="16" height="16" rx="3" fill="#F59E0B" transform="rotate(45 218 148)" filter="url(#neonGlow)"/>

    <!-- Bottom Node (Amethyst Violet) -->
    <circle cx="180" cy="242" r="8" fill="#8B5CF6" filter="url(#neonGlow)"/>

    <!-- Brand Typography around Medallion -->
    <text x="180" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NEXDRIVE</text>
    <text x="180" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#00D2A0" text-anchor="middle" letter-spacing="2">TIER-1 FLASH VERIFIED</text>
  </g>
</svg>
